<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f9fc">
<meta name="color-scheme" content="only light">
<title>Offline · RailGo</title>
<style>
  :root { --bg:#f8f9fc; --ink:#141822; --muted:#5d6474; --accent:#0b7a5c; color-scheme: only light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align:center; }
  img { width:88px; height:88px; border-radius:22px; }
  h1 { font-size:20px; margin:20px 0 6px; }
  p { margin:0 0 20px; color:var(--muted); }
  button { border:0; border-radius:12px; padding:10px 18px; font:inherit; font-weight:600; background:var(--accent); color:#fff; cursor:pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>RailGo needs internet for live PNR status. Check your connection.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
